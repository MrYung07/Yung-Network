<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080610"><title>Admin News — Yung Network</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1000px;margin:0 auto;padding:110px 24px 70px}.admin-panel{background:#100d1b;border:1px solid #302344;border-radius:18px;padding:24px;margin:20px 0}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;color:#c9c2d8;font-size:.9rem}.admin-form input,.admin-form textarea,.admin-form select{width:100%;background:#080610;border:1px solid #403354;border-radius:9px;padding:12px;color:#fff;font:inherit}.admin-form textarea{min-height:110px;resize:vertical}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-item{border-top:1px solid #302344;padding:15px 0;display:flex;gap:15px;justify-content:space-between;align-items:center}.admin-item p{margin:4px 0;color:#aaa}.admin-msg{color:#c9a5ff;min-height:1.3em}.hidden{display:none!important}@media(max-width:600px){.admin-row{grid-template-columns:1fr}.admin-panel{padding:16px}}
</style></head><body><div class="noise" aria-hidden="true"></div><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">Y<span>N</span></span><span class="brand-name">YUNG <b>NETWORK</b></span></a><a class="button button-small button-ghost" href="index.html">← TORNA AL SITO</a></header><main class="admin-wrap"><span class="section-kicker">PRIVATE CONSOLE / 001</span><h1>NEWS <span class="gradient-text">ADMIN.</span></h1><p>Accedi con l'account autorizzato per gestire le news del network.</p><section id="login-panel" class="admin-panel"><h2>Accesso amministratore</h2><form id="login-form" class="admin-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">ACCEDI</button></form><p id="login-msg" class="admin-msg" role="status"></p></section><section id="dashboard" class="hidden"><div class="admin-panel"><div class="admin-actions" style="justify-content:space-between;align-items:center"><h2 id="form-heading">Pubblica una news</h2><button id="logout" class="button button-ghost" type="button">ESCI</button></div><form id="news-form" class="admin-form"><input type="hidden" name="id"><label>Titolo<input name="title" maxlength="120" required></label><div class="admin-row"><label>Categoria<select name="category"><option>Gaming</option><option>Community</option><option>Eventi</option><option>Streaming</option><option>Discord</option></select></label><label>Stato<select name="status"><option value="published">Pubblicata</option><option value="draft">Bozza</option></select></label></div><label>Breve descrizione<textarea name="summary" maxlength="350" required></textarea></label><label>Contenuto completo<textarea name="content"></textarea></label><label>URL immagine (facoltativo)<input name="image_url" type="url" placeholder="https://..."></label><div class="admin-actions"><button class="button button-primary" type="submit">SALVA NEWS</button><button class="button button-ghost" id="cancel-edit" type="button">NUOVA NEWS / ANNULLA</button></div></form><p id="form-msg" class="admin-msg" role="status"></p></div><div class="admin-panel"><h2>News esistenti</h2><div id="news-list">Caricamento…</div><p id="list-msg" class="admin-msg" role="status"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
